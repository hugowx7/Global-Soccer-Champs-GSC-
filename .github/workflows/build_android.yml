
name: Build Android APK

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Exportar APK Android
    runs-on: ubuntu-24.04
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataformas Android exigidas pelo preset
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Instalar Godot 4.7.2 e Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false
          include-templates: true

      - name: Localizar ou extrair o projeto Godot
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "project.godot" ]]; then
            PROJECT_DIR="."
          elif [[ -f "GlobalSoccerChamps_Godot/project.godot" ]]; then
            PROJECT_DIR="GlobalSoccerChamps_Godot"
          elif [[ -f "GSC_Projeto_Completo.zip" ]]; then
            mkdir -p _godot_source
            unzip -q GSC_Projeto_Completo.zip -d _godot_source
            if [[ -f "_godot_source/GlobalSoccerChamps_Godot/project.godot" ]]; then
              PROJECT_DIR="_godot_source/GlobalSoccerChamps_Godot"
            elif [[ -f "_godot_source/project.godot" ]]; then
              PROJECT_DIR="_godot_source"
            else
              echo "project.godot não encontrado dentro do ZIP de origem."
              exit 1
            fi
          else
            echo "Envie os arquivos do projeto ou GSC_Projeto_Completo.zip para a raiz do repositório."
            exit 1
          fi
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Projeto selecionado: ${PROJECT_DIR}"

      - name: Gerar debug.keystore automaticamente
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storetype PKCS12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Global Soccer Champs,C=BR"

      - name: Configurar caminhos do Android para o Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF2

      - name: Importar recursos e validar projeto
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p build
          godot --headless --editor --path . --import --quit

      - name: Exportar GlobalSoccerChamps.apk
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          godot --headless --path . --export-debug "Android" build/GlobalSoccerChamps.apk
          test -s build/GlobalSoccerChamps.apk
          sha256sum build/GlobalSoccerChamps.apk | tee build/GlobalSoccerChamps.apk.sha256

      - name: Disponibilizar APK na aba Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Global-Soccer-Champs-Android-APK
          path: |
            ${{ env.PROJECT_DIR }}/build/GlobalSoccerChamps.apk
            ${{ env.PROJECT_DIR }}/build/GlobalSoccerChamps.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK em Releases quando houver tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${PROJECT_DIR}/build/GlobalSoccerChamps.apk" \
            --title "Global Soccer Champs ${GITHUB_REF_NAME}" \
            --notes "APK Android de teste do Global Soccer Champs compilado pelo GitHub Actions."
