
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar jogo Android
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar arquivos do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709"

      - name: Instalar Godot 4.3.0
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false
          include-templates: true

      - name: Extrair projeto
        run: |
          set -e
          test -f GSC_Projeto_Completo.zip
          mkdir -p projeto
          unzip -q GSC_Projeto_Completo.zip -d projeto
          test -f projeto/GlobalSoccerChamps_Godot/project.godot
          echo "PROJECT_DIR=projeto/GlobalSoccerChamps_Godot" >> "$GITHUB_ENV"

      - name: Criar chave de teste
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=GSC,C=BR"

      - name: Configurar caminhos Android
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: Importar projeto
        run: |
          cd "$PROJECT_DIR"
          godot --headless --editor --path . --import --quit

      - name: Gerar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd "$PROJECT_DIR"
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/GlobalSoccerChamps.apk
          test -s build/GlobalSoccerChamps.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Global-Soccer-Champs-APK
          path: ${{ env.PROJECT_DIR }}/build/GlobalSoccerChamps.apk
          if-no-files-found: error
          retention-days: 30
